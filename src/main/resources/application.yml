# Hosts such as Railway/Render inject PORT; default stays 8080 locally.
server:
  port: ${PORT:8080}

spring:
  application:
    name: oms
  datasource:
    url: jdbc:h2:mem:oms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Development-only placeholder (>= 32 bytes for HS256). Real deployments set JWT_SECRET (see application-postgres.yml).
    secret: dev-only-jwt-secret-change-me-0123456789abcdef
    ttl-minutes: 60
  returns:
    window-days: 7
  checkout:
    max-retries: 3
  seed:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
